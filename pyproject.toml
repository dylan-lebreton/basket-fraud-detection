[project]
name = "fraud-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dylan Lebreton", email = "dylan.lebreton1996@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.94",
    "polars>=1.40.1",
    "pydantic-settings>=2.14.0",
]

[project.optional-dependencies]
training = [
    "mlflow>=3.11.1",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
