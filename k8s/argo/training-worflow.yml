apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fraud-training
  namespace: fraud-detection
spec:
  entrypoint: train
  templates:
    - name: train
      container:
        image: ghcr.io/dylan-lebreton/fraud-training:latest
        imagePullPolicy: Always
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.fraud-detection.svc.cluster.local:5000
          - name: MLFLOW_S3_ENDPOINT_URL
            value: http://minio.fraud-detection.svc.cluster.local:9000
          - name: AWS_DEFAULT_REGION
            value: us-east-1
          - name: RAW_BUCKET
            value: fraud-raw-data
          - name: X_TRAIN_KEY
            value: X_train.csv
          - name: Y_TRAIN_KEY
            value: Y_train.csv
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: root-user
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: root-password
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi